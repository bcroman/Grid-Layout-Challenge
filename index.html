<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Grid Boxes -->
    <div class="grid-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
    </div>

    <!-- navigation bar -->
    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <!-- UYser Invite Form -->
    <section class="invite-form">
        <h2>Invite Users</h2>

        <form>
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter email">

            <button type="submit">Send Invite</button>
            <a href="#" class="skip-link">Skip this step</a>
        </form>
    </section>

</body>

</html>
