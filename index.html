<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Grid Boxes -->
    <div class="grid-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
    </div>

    <!-- navigation bar -->
    <nav class="navbar">
        <h1 class="logo">LOGO</h1>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Purchase</a>
            <a href="#">Featured</a>
            <a href="#">Contact Us</a>
        </div>
    </nav>

    <!-- UYser Invite Form -->
    <section class="invite-section">

        <!-- Progress Steps -->
        <div class="progress-steps">
            <span class="circle"></span>
            <span class="circle"></span>
            <span class="circle"></span>
        </div>

        <div class="invite-form">
            <h2>INVITE USERS</h2>

            <form>
                <input type="email" placeholder="Email 1">
                <input type="email" placeholder="Email 2">
                <input type="email" placeholder="Email 3">
                <input type="email" placeholder="Email 4">

                <button type="submit">SEND INVITES!</button>

                <a href="#" class="skip-link">
                    SKIP THIS STEP
                </a>
            </form>
        </div>
    </section>


</body>

</html>
